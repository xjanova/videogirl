<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>minde</title>

<!--
  หน้านี้คือเวทีของมายด์ ไม่ใช่ UI — Flutter วาด UI ทั้งหมดทับข้างบนอีกที
  พื้นหลังต้องโปร่งจริง (renderer สร้างด้วย alpha:true อยู่แล้ว) ไม่งั้นจะบังก้อนแสง

  เครื่องยนต์ยกมาจาก xjanova/BrainX → BrainX.Client/wwwroot/universe
  แก้ที่นั่นแล้วค่อยซิงก์กลับมา อย่าแก้แยกสองที่
-->

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "@pixiv/three-vrm": "./vendor/three-vrm/three-vrm.module.min.js"
} }
</script>

<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
</style>
</head>
<body>
<div id="stage"></div>

<script type="module">
import * as THREE from 'three';
import { Avatar } from './avatar.js';

const stage = document.getElementById('stage');

/** ส่งสถานะกลับฝั่ง Flutter — เงียบไว้ถ้าไม่ได้รันในแอป (เช่นเปิดดูใน Chrome) */
const post = (type, data = {}) => {
  try {
    window.flutter_inappwebview?.callHandler('minde', { type, ...data });
  } catch (_) { /* เปิดนอกแอปอยู่ ไม่ต้องทำอะไร */ }
};

let avatar = null;

try {
  // โมเดลกับคลิปไม่ได้อยู่ใน git (ดู THIRD_PARTY.md) แอปจะวางไว้ใต้ ./model/
  // ตอนรันครั้งแรก ถ้ายังไม่มี ให้ Flutter ขึ้นกรอบ placeholder ตามดีไซน์แทน
  // ชุดตัวเธออาจอยู่ในแอป (build ในเครื่องที่มีไฟล์ครบ) หรือถูกโหลดทีหลัง
  // ลงดิสก์แล้วเสิร์ฟจากพอร์ตอื่น (APK จาก CI ที่ไม่มีไฟล์ฝังมา)
  // Flutter บอกทางมาทาง ?pack= · ไม่มี = ใช้ของในแอปเหมือนเดิม
  // ชุดของเลขาคนอื่นไม่ได้ชื่อ minde.vrm — Flutter บอกชื่อไฟล์มาด้วย
  const q = new URLSearchParams(location.search);
  const pack = q.get('pack');
  avatar = new Avatar(stage, {
    base: pack || './model/',
    model: q.get('model') || 'minde.vrm',
  });

  // รายงานความคืบหน้าจริงออกไปให้หน้าเปิดแอป
  //
  // ปัดเป็นจำนวนเต็มก่อนส่ง ไม่งั้นยิงข้ามสะพานทุก chunk ที่โหลดมา
  // ซึ่งกับไฟล์ 33MB คือหลายพันครั้งโดยที่ตัวเลขบนจอเปลี่ยนเท่าเดิม
  let lastPct = -1;
  avatar.onProgress = (p) => {
    const pct = Math.round(p * 100);
    if (pct === lastPct) return;
    lastPct = pct;
    post('progress', { pct });
  };

  // ตัวเธอขึ้นจอแล้ว — มาก่อนคลิปท่าทางโหลดเสร็จ
  // หน้าเปิดแอปรอสัญญาณนี้ ไม่ใช่รอ 'ready' ที่ต้องรอคลิปครบอีกหลายวินาที
  avatar.onVisible = () => post('visible');

  // เวทีตายกลางทาง — ต้องดังพอ ๆ กับตายตอนโหลด ไม่ใช่จอว่างเปล่าที่เงียบ
  avatar.onLoopError = (msg) => post('error', { message: msg });

  await avatar.loaded;
  post('ready');
} catch (err) {
  post('error', { message: String(err?.message ?? err) });
}

/**
 * เล่นเสียงจากไบต์ที่ Flutter ส่งมาเป็น base64
 *
 * ทำไมต้องเป็น Blob ไม่ใช่ URL ของ OpenAI ตรง ๆ:
 * lipsync.js ต่อ createMediaElementSource() เข้ากับ AnalyserNode เพื่ออ่านคลื่นเสียง
 * ถ้าเสียงมาจากคนละ origin โดยไม่มี CORS header ที่ถูกต้อง WebAudio จะถือว่า
 * "tainted" แล้วป้อนศูนย์ให้ analyser — เสียงดังปกติ แต่ปากไม่ขยับเลย
 * และไม่มี error ที่ไหนบอก · blob: เป็น same-origin เสมอ จึงไม่มีปัญหานี้
 */
/** สถานะ AudioContext — 'suspended' คือสาเหตุอันดับหนึ่งที่เสียงเงียบโดยไม่มี error */
const ctxState = () => avatar?.lip?.ctx?.state ?? 'ยังไม่สร้าง';

async function speakBytes(b64, mime) {
  if (!avatar) {
    post('speak-failed', { why: 'อวาตาร์ยังไม่พร้อม' });
    return false;
  }

  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: mime || 'audio/mpeg' }));

  post('speak-start', { bytes: bytes.length, mime, ctx: ctxState() });
  try {
    const done = await avatar.speak(url);
    post('speak-done', { done, ctx: ctxState(), level: avatar.lip?.level ?? -1 });
    return done;
  } catch (err) {
    post('speak-failed', { why: String(err?.message ?? err), ctx: ctxState() });
    return false;
  } finally {
    // ปล่อยทันทีที่เล่นจบ ไม่งั้นคุยยาว ๆ จะสะสมไฟล์เสียงไว้ในหน่วยความจำทั้งหมด
    URL.revokeObjectURL(url);
  }
}

/**
 * กรอบสี่เหลี่ยมรอบ "หัว" ของเธอ เป็นพิกเซลบนผืนผ้าใบ
 *
 * ใช้ทำรูปหน้าสำหรับปุ่มกลางแถบนำทาง — ต้องคำนวณจากกระดูก head จริง
 * ไม่ใช่ครอปกลางภาพมั่ว ๆ เพราะ framing.js วางเธอ **เยื้องซ้าย** จากกึ่งกลาง
 * (กล้อง dolly ออกด้านข้าง) ครอปกลางจะได้ไหล่กับฉากหลังแทนหน้า
 *
 * คืน null ถ้าโมเดลยังไม่พร้อม ผู้เรียกต้องเผื่อกรณีนี้เสมอ
 */
function headRect() {
  const vrm = avatar?.vrm, cam = avatar?.camera, ren = avatar?.renderer;
  if (!vrm || !cam || !ren) return null;

  const head = vrm.humanoid?.getNormalizedBoneNode?.('head')
            ?? vrm.humanoid?.getRawBoneNode?.('head');
  if (!head) return null;

  const w = ren.domElement.clientWidth, h = ren.domElement.clientHeight;
  if (!w || !h) return null;

  const centre = new THREE.Vector3();
  head.getWorldPosition(centre);

  // ใช้จุดเหนือหัวขึ้นไปเล็กน้อยเป็นตัววัดขนาด จะได้กรอบที่พอดีหน้า
  // ไม่ว่ากล้องจะอยู่ระยะ bust หรือ full
  const above = centre.clone().add(new THREE.Vector3(0, 0.16, 0));

  const p = centre.clone().project(cam);
  const q = above.clone().project(cam);

  const toPx = (v) => ({ x: (v.x * 0.5 + 0.5) * w, y: (-v.y * 0.5 + 0.5) * h });
  const c = toPx(p), a = toPx(q);

  // ระยะจากกลางหัวถึงเหนือหัว = ครึ่งความสูงของกรอบโดยประมาณ
  const half = Math.max(24, Math.abs(c.y - a.y) * 1.55);

  return {
    x: Math.round(c.x - half),
    y: Math.round(c.y - half),
    size: Math.round(half * 2),
    canvasW: w,
    canvasH: h,
  };
}

/**
 * ถ่ายรูปหน้าเธอเป็น PNG base64 สำหรับใช้เป็นไอคอนปุ่มกลางแถบนำทาง
 *
 * ทำไมต้องถ่ายในหน้าเว็บ ไม่ใช่ `takeScreenshot` ของ Android:
 * ฝั่ง native วาดด้วย View.draw() ลง software Bitmap ซึ่ง **ไม่มีผลของ WebGL**
 * ที่ถูก composite ด้วย GPU แยกต่างหาก จะได้ภาพโปร่งหรือดำเปล่า ๆ
 *
 * ทำไมต้อง render ก่อน toDataURL ในจังหวะเดียวกัน:
 * renderer สร้างโดยไม่ได้ตั้ง `preserveDrawingBuffer` เบราว์เซอร์จึงล้าง
 * drawing buffer ทิ้งหลังจบเฟรม อ่านทีหลังจะได้ภาพเปล่า ต้องอ่านทันทีหลังวาด
 */
async function snapshotFace(px) {
  const ren = avatar?.renderer, cam = avatar?.camera, scn = avatar?.scene;
  if (!ren || !cam || !scn) return null;

  const size = px || 256;
  const prevFraming = avatar.speaking ? 'bust' : 'full';

  try {
    // ดึงกล้องเข้ามาใกล้ก่อน แล้วเร่งให้ถึงเป้าทันทีโดยไม่ต้องรอ ease
    avatar.framing?.set('bust');
    for (let i = 0; i < 40; i++) avatar.framing?.update(1 / 30, 40);

    // วาดแล้วอ่านในจังหวะเดียวกัน ห้ามมี await คั่น
    ren.render(scn, cam);
    const full = ren.domElement.toDataURL('image/png');

    const box = headRect();
    if (!box) return full;

    // ครอปเฉพาะหัวด้วย canvas ชั่วคราว
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = full; });

    const scaleX = img.width / box.canvasW;
    const scaleY = img.height / box.canvasH;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.drawImage(
      img,
      box.x * scaleX, box.y * scaleY, box.size * scaleX, box.size * scaleY,
      0, 0, size, size,
    );
    return c.toDataURL('image/png');
  } catch (err) {
    post('snapshot-failed', { why: String(err?.message ?? err) });
    return null;
  } finally {
    avatar.framing?.set(prevFraming);
  }
}

/** API ที่ฝั่ง Flutter เรียกผ่าน evaluateJavascript */
window.minde = {
  headRect,
  snapshotFace,
  mood:  (m)   => avatar?.setMood(m),
  speak: (url) => avatar?.speak(url),
  speakBytes,
  stop:  ()    => avatar?.stop(),
  sit:   ()    => avatar?.sit(),
  stand: ()    => avatar?.stand(),
  /** 'bust' ตอนคุย · 'full' ตอนยืนเฉย ๆ */
  frame: (n)   => avatar?.framing?.set(n),

  /**
   * ค่าสีหน้าที่กำลังใช้อยู่จริงในวินาทีนี้
   *
   * มีไว้เพราะสีหน้าเป็นสิ่งที่**ล้มแบบเงียบที่สุดในแอปนี้** — ตั้งค่าชื่อ
   * expression ที่โมเดลไม่มี แล้ว three-vrm จะเมินให้เฉย ๆ ไม่มี error
   * ไม่มี log · ดูจากจอก็แยกไม่ออกว่า "ไม่ยิ้มเพราะยังไม่ถึงรอบ" กับ
   * "ไม่ยิ้มเพราะสั่งชื่อผิดมาตลอด" · ตัวเลขตอบได้ ตาเปล่าตอบไม่ได้
   */
  probe: () => {
    const em = avatar?.vrm?.expressionManager;
    if (!em) return null;
    const values = {};
    for (const n of Object.keys(em.expressionMap ?? {})) {
      values[n] = Number((em.getValue(n) ?? 0).toFixed(3));
    }
    const m = avatar.motion;
    return {
      warmth:  Number((avatar.idle?.warmth ?? 0).toFixed(3)),
      values,
      mood:    avatar.mood,
      talking: !!m?.talking,
      gesture: m?.gesture?.meta.id ?? null,
      clip:    m?.current?.meta.id ?? null,
      missing: m?.missing ?? [],
      // ชุดนี้ขยับคิ้ว/ลิ้นได้ไหม — คำถามที่ตาเปล่าตอบไม่ได้ เพราะ morph
      // ที่ไม่มีคือ**ความเงียบ** ไม่ใช่ error · รายงานดีบัคอ่านค่านี้ไปด้วย
      morphs: avatar.morphs?.report() ?? null,
    };
  },

  // ── กล้องเชิดหุ่น ────────────────────────────────────────
  // start เป็น async เพราะต้องขอสิทธิ์กล้องกับโหลด wasm 11MB
  // ฝั่ง Flutter ต้องเรียกด้วย callAsyncJavaScript ไม่ใช่ evaluateJavascript
  /**
   * ระยะกล้องของโหมดเชิดหุ่น — 'face' | 'bust' | 'full'
   *
   * แยกจาก `frame()` โดยตั้งใจ · `frame()` เป็นคำขอของตัวจัดฉากอัตโนมัติ
   * ซึ่งถูกล็อกทับได้ ส่วนตัวนี้คือคำสั่งของเจ้าของที่ไม่มีอะไรมาทับ
   */
  mocapShot:      (n)  => avatar?.setMocapShot(n) ?? null,
  mocapStart:     ()  => avatar?.startMocap() ?? null,
  mocapStop:      ()  => avatar?.stopMocap() ?? null,
  mocapCalibrate: ()  => avatar?.recalibrate() ?? null,
  mocapStatus:    ()  => avatar?.mocapStatus() ?? null,
};

/**
 * บอก Flutter เมื่อสถานะกล้อง**เปลี่ยน** ไม่ใช่ให้ Flutter ยิงถามรัวข้ามสะพาน
 *
 * ปัดความคืบหน้าเป็นขั้นละ 5% ก่อนเทียบ ไม่งั้นตอนคาลิเบรตค่าจะขยับทุกเฟรม
 * แล้วเรายิงข้ามสะพาน 30 ครั้งต่อวินาทีเพื่อบอกเรื่องเดียวกัน
 */
let mocapSeen = '';
setInterval(() => {
  const st = avatar?.mocapStatus?.();
  if (!st) return;
  const key = [st.phase, st.active, st.tracking,
               Math.round(st.progress * 20), st.error ?? ''].join('|');
  if (key === mocapSeen) return;
  mocapSeen = key;
  post('mocap', st);
}, 150);

// เกาะขนาดของ #stage ไว้ตลอด ไม่ใช่รอ event resize ของ window
//
// 🔴 ของเดิมดักแค่ `resize` ของ window ซึ่ง**บนมือถือไม่เคยเกิดขึ้นเลย**
// canvas จึงค้างที่ขนาดสำรอง 320 ที่ constructor เดาไว้ตอน WebView ยังไม่ layout
// ผลคือเธอเรนเดอร์ในกล่องแคบชิดซ้ายทั้งเซสชัน เยื้องจากกึ่งกลางจอ ~104px
// และเล็กกว่าที่ควรจะเป็น โดยไม่มี error ที่ไหนบอกเลย
avatar?.watchSize(stage);
</script>
</body>
</html>
