name: release

# ปล่อย APK ขึ้น GitHub Releases ให้ระบบ auto-update ในแอปมาโหลดต่อ
#
# ยิงเมื่อ push tag ที่ขึ้นต้นด้วย v เช่น v0.2.0
# ต้องแนบ SHA256SUMS.txt ไปด้วยเสมอ ไม่งั้นแอปจะปฏิเสธการติดตั้ง
# (ดู lib/update/updater.dart — ไม่มีแฮช = ไม่ติดตั้ง โดยตั้งใจ)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ติดตั้ง dependencies
        run: flutter pub get

      - name: ตรวจโค้ดและรันเทสต์
        run: |
          flutter analyze
          flutter test

      # keystore ต้องเป็นตัวเดิมทุก release ไม่งั้นเครื่องที่ลงไปแล้วอัปเดตทับไม่ได้
      # เก็บเป็น base64 ใน secret ชื่อ ANDROID_KEYSTORE_BASE64
      - name: เตรียม keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret ANDROID_KEYSTORE_BASE64 — release ที่เซ็นด้วย debug key จะอัปเดตทับไม่ได้"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # หมายเหตุความปลอดภัย: คีย์ที่ --dart-define เข้าไปจะ **ฝังอยู่ใน APK**
      # ใครโหลด APK จาก release สาธารณะไปแกะก็อ่านคีย์ได้
      # ใช้ได้เฉพาะช่วงทดลองเท่านั้น ก่อนเปิดให้คนอื่นใช้ต้องย้ายไปเรียกผ่าน
      # backend ของเราเอง แล้วให้แอปถือ token ของผู้ใช้แทน (ดู docs/security.md)
      - name: Build APK
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --dart-define=OPENAI_MODEL=gpt-5.6-sol

      - name: ตั้งชื่อไฟล์ตาม tag และทำ SHA256SUMS.txt
        id: pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/minde-$VERSION.apk"
          cd dist
          sha256sum "minde-$VERSION.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/minde-${{ steps.pack.outputs.version }}.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
