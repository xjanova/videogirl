name: release

# ออก release เองอัตโนมัติ: push ขึ้น main → คิดเวอร์ชันถัดไป → build APK →
# ทำ SHA256SUMS.txt → สร้าง GitHub Release ให้ระบบ auto-update ในแอปมาโหลดต่อ
#
# ไม่ต้องแท็กเอง ไม่ต้องแก้ pubspec.yaml — **แท็กใน repo คือแหล่งความจริงของเวอร์ชัน**
# (ถ้าให้ workflow commit เลขเวอร์ชันกลับเข้า main จะวนลูปกับตัวเอง และพังทันที
#  ที่ main ถูกป้องกัน — อ่านจากแท็กแทนจึงไม่มีทั้งสองปัญหา)
#
# ข้ามการออก release ชั่วคราว: ใส่ [skip release] ในข้อความ commit
# อยากขยับ minor/major หรือกำหนดเวอร์ชันเอง: กด Run workflow แล้วเลือก

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - '.idea/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'ขยับเวอร์ชันระดับไหน'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'กำหนดเวอร์ชันเอง เช่น 1.2.0 (ใส่แล้วจะไม่สนใจ bump)'
        type: string
        default: ''

permissions:
  contents: write

# สอง push ติดกันต้องไม่แย่งกันคิดเลขเวอร์ชันเดียวกัน ให้ต่อคิวแทน ห้ามยกเลิก
# ตัวที่กำลัง build อยู่ ไม่งั้น release ที่ทำค้างไว้ครึ่งทางจะหายไปเฉย ๆ
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ต้องได้แท็กมาครบ ไม่งั้นคิดเวอร์ชันถัดไปไม่ได้

      - name: คิดเลขเวอร์ชันถัดไปจากแท็กล่าสุด
        id: ver
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          PINNED: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          # กรองด้วย grep ซ้ำอีกชั้น — glob ของ git tag ปล่อย v1.2.3-beta ผ่านมาได้
          # แล้ว $((PA + 1)) จะพังเพราะ PA เป็น "3-beta" ไม่ใช่ตัวเลข
          LATEST="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"

          if [ -n "$PINNED" ]; then
            NEXT="${PINNED#v}"
          elif [ -z "$LATEST" ]; then
            # ยังไม่เคยออก release เลย — ใช้เวอร์ชันใน pubspec ตรง ๆ ไม่ต้องขยับ
            NEXT="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          else
            IFS=. read -r MA MI PA <<< "${LATEST#v}"
            case "$BUMP" in
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              minor) MI=$((MI + 1)); PA=0 ;;
              *)     PA=$((PA + 1)) ;;
            esac
            NEXT="$MA.$MI.$PA"
          fi

          if ! printf '%s' "$NEXT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::เวอร์ชัน '$NEXT' ผิดรูป ต้องเป็น X.Y.Z"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::แท็ก v$NEXT มีอยู่แล้ว — ลบ release/แท็กเดิมก่อน หรือกด Run workflow แล้วกำหนดเวอร์ชันเอง"
            exit 1
          fi

          IFS=. read -r MA MI PA <<< "$NEXT"
          if [ "$MI" -gt 99 ] || [ "$PA" -gt 99 ]; then
            echo "::error::minor/patch เกิน 99 — สูตร versionCode รองรับไม่ได้ ต้องขยับ major"
            exit 1
          fi

          # versionCode ต้องเพิ่มขึ้นทุกครั้ง ไม่งั้น Android ปฏิเสธการติดตั้งทับ
          # ผูกกับเลขเวอร์ชันตรง ๆ ไม่ใช่เลข run ของ Actions เพราะเลข run รีเซ็ต
          # ได้เมื่อเปลี่ยนชื่อไฟล์ workflow แล้ว versionCode จะเดินถอยหลัง
          CODE=$((MA * 10000 + MI * 100 + PA))

          echo "version=$NEXT"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE"     >> "$GITHUB_OUTPUT"
          echo "### จะออก \`v$NEXT\` (versionCode $CODE)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ตรึงเวอร์ชันไว้ ไม่ใช้ channel: stable ลอย ๆ
      #
      # stable เป็นเป้าที่ขยับตลอด และ `flutter analyze` นับ info เป็น error ด้วย
      # วันที่ Flutter ออก stable ใหม่พร้อม deprecation warning สักตัว release จะ
      # พังเองทั้งที่ไม่มีใครแตะโค้ด (เกิดจริงมาแล้ว: 3.47.2 เตือน axisAlignment
      # ใน home_screen.dart ซึ่งเครื่องที่ใช้ 3.41.7 มองไม่เห็น แล้วแก้ตามก็ไม่ได้
      # เพราะตัวแทนอย่าง alignment ยังไม่มีใน 3.41.7)
      #
      # ตรึงไว้แล้วได้ของแถม: commit เดิมให้ APK เดิมเสมอ ไม่ขึ้นกับว่า build วันไหน
      # เวลาจะขยับเวอร์ชัน ให้แก้บรรทัดล่างนี้เป็น commit แยก จะได้เห็นชัดว่า
      # อะไรพังเพราะ Flutter ไม่ใช่เพราะโค้ดเรา — และต้องขยับในเครื่องให้ตรงกันด้วย
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: ติดตั้ง dependencies
        run: flutter pub get

      - name: ตรวจโค้ดและรันเทสต์
        run: |
          flutter analyze
          flutter test

      # keystore ต้องเป็นตัวเดิมทุก release ไม่งั้นเครื่องที่ลงไปแล้วอัปเดตทับไม่ได้
      # เก็บเป็น base64 ใน secret ชื่อ ANDROID_KEYSTORE_BASE64
      - name: เตรียม keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret ANDROID_KEYSTORE_BASE64 — release ที่เซ็นด้วย debug key จะอัปเดตทับไม่ได้"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          # เขียนผ่านตัวแปร env ไม่ใช่แทนค่า expression ลงมาตรง ๆ
          # รหัสที่มีอักขระพิเศษจะได้ไม่ทำ heredoc พัง
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # **ไม่ --dart-define คีย์อะไรเข้าไปเลย โดยตั้งใจ**
      #
      # release นี้ตั้งใจให้เธอคิดด้วย Gemma บนเครื่อง ไม่ต้องพึ่งคีย์ของใคร
      # และคีย์ที่ --dart-define เข้าไปจะ **ฝังอยู่ใน APK** ใครโหลดจาก release
      # สาธารณะไปแกะก็อ่านได้ (--obfuscate ไม่ช่วย ค่าคงที่ยังเป็นสตริงเปล่า ๆ)
      # ถ้าวันหนึ่งต้องใช้บริการที่มีคีย์จริง ๆ ให้ต่อผ่าน backend ของเราเอง
      # แล้วให้แอปถือ token ของผู้ใช้แทน ไม่ใช่กลับมายัดคีย์ตรงนี้ (docs/security.md)
      - name: Build APK
        run: |
          set -euo pipefail
          flutter build apk --release --build-name="${{ steps.ver.outputs.version }}" --build-number="${{ steps.ver.outputs.code }}" --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      # ต้องแนบ SHA256SUMS.txt ไปด้วยเสมอ ไม่งั้นแอปจะปฏิเสธการติดตั้ง
      # (ดู lib/update/updater.dart — ไม่มีแฮช = ไม่ติดตั้ง โดยตั้งใจ)
      - name: ตั้งชื่อไฟล์และทำ SHA256SUMS.txt
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/giggok-$VERSION.apk"
          # --obfuscate ทำให้ stack trace อ่านไม่ออก ถ้าไม่เก็บ symbol ไว้ด้วย
          # แนบไปกับ release เลย จะได้ไม่ต้องไปไล่หาว่า build ไหนใช้ symbol ชุดไหน
          (cd build/symbols && zip -qr "$GITHUB_WORKSPACE/dist/debug-symbols-$VERSION.zip" .)
          cd dist
          sha256sum "giggok-$VERSION.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          # แอปข้าม draft/prerelease ทิ้ง และอ่านจาก /releases/latest เท่านั้น
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/giggok-${{ steps.ver.outputs.version }}.apk
            dist/SHA256SUMS.txt
            dist/debug-symbols-${{ steps.ver.outputs.version }}.zip
